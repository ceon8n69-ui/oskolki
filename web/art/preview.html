<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Осколки — визуальная мастерская</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#21374d;background:#b5c8ba;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}header{position:fixed;inset:0 0 auto;background:#f4eddfef;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 20px 20px;box-shadow:0 4px 20px #2343}h1{font:700 23px Georgia;margin:0}header span{font-size:12px;letter-spacing:1px}aside{position:fixed;left:24px;top:90px;background:#20364eef;color:#f8efd9;padding:14px 20px;border-radius:12px;font-size:13px;line-height:1.7}aside small{display:block;color:#bfd0d9}section{position:fixed;bottom:82px;left:24px;background:#f7efdfed;border:1px solid #fff9;border-radius:18px;padding:18px 24px;min-width:300px}section h2{font:700 24px Georgia;margin:0 0 7px}section p{font-size:13px;margin:0;color:#657480}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:9px;padding:13px 22px;background:#1c3049;border-radius:20px 20px 0 0}button{font:600 13px system-ui;background:#304760;color:#f7f0df;border:1px solid #ffffff30;border-radius:10px;padding:14px 18px;cursor:pointer}button.active{background:#ecc073;color:#293e52}nav label{margin:auto 0 auto auto;color:#e6ebec;font-size:12px}#zoom{position:fixed;right:20px;top:90px;display:grid;gap:8px}#zoom button{background:#f7edda;color:#22394e}@media(max-width:600px){h1{font-size:17px}header{padding:16px}header span{font-size:9px;max-width:90px}aside{left:12px;top:74px;font-size:11px;padding:10px 14px}section{left:12px;right:12px;min-width:0;bottom:163px;padding:14px}section h2{font-size:20px}nav{flex-wrap:wrap;padding:10px;gap:6px;max-height:150px;overflow:auto}button{padding:12px 10px;font-size:11px}nav label{width:100%;text-align:right}#zoom{top:160px;right:10px}}
#actions{position:fixed;display:flex;gap:8px;transform:translateX(-50%)}#actions button{width:46px;height:46px;border-radius:50%;padding:0;font-size:24px;border:3px solid #fff3d8;background:#2d6295;box-shadow:0 4px 8px #18334755}#actions button:nth-child(2){background:#ae4e39}#actions button:nth-child(3){background:#566475}canvas{touch-action:none}button:focus-visible{outline:3px solid #f3b84e;outline-offset:3px}section{pointer-events:none}#scene{background:#b9c9bc}
</style><canvas id="scene"></canvas><header><h1>♛ ОСКОЛКИ КОРОЛЕВСТВ</h1><span>◉ 18　 ▰ 6　 ◆ 3　 · ХОД 12</span></header><aside>Удерживайте святилища: 1 / 3<small>Визуальный прототип · бой у моста</small></aside><div id="zoom"><button id="plus" aria-label="Приблизить">＋</button><button id="minus" aria-label="Отдалить">−</button></div><section><h2 id="title">Страж Союза</h2><p id="desc">Сталь, синие знамёна и тёплый камень</p></section><div id="actions"><button data-action="walk" aria-label="Показать движение">↟</button><button data-action="attack" aria-label="Показать атаку">⚔</button><button data-action="defend" aria-label="Показать защиту">⬡</button></div><nav><button data-mode="idle" class="active">Ожидание</button><button data-mode="walk">Движение</button><button data-mode="attack">Атака</button><button data-mode="melee">Удар</button><button data-mode="capture">Захват</button><button data-mode="defend">Защита</button><button data-mode="build">Стройка</button><label><input id="motion" type="checkbox"> Уменьшить движение</label></nav><script type="module">
import{makePainter,project,unproject,drawTile,drawTree,drawMountain,drawBridge,drawCastle,drawFarm,drawUnit,drawProjectile,drawImpact,drawBank,drawShrub,drawSmoke}from'./kingdom-art.js';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let mode='idle',start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,c={x:6,y:6,size:Math.min(76,innerWidth/8),width:innerWidth,height:innerHeight};document.getElementById('motion').checked=reduced;document.getElementById('motion').onchange=e=>reduced=e.target.checked;
function resize(){c.width=innerWidth;c.height=innerHeight;let d=Math.min(devicePixelRatio,2);canvas.width=c.width*d;canvas.height=c.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();onresize=resize;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;start=performance.now();document.querySelectorAll('[data-mode]').forEach(v=>v.classList.toggle('active',v===b));document.getElementById('title').textContent={idle:'Страж Союза',walk:'Марш через долину',attack:'Залп лучника',melee:'Удар стража',capture:'Знамя нового владельца',defend:'Защитная стойка',build:'Возведение крепости'}[mode];document.getElementById('desc').textContent={idle:'Сталь, синие знамёна и тёплый камень',walk:'Передвижение по клеткам · демонстрационный маршрут',attack:'Подготовка → полёт стрелы → попадание',melee:'Замах → выпад → попадание → поражение',capture:'Смена знамени после подтверждённого захвата',defend:'Страж удерживает позицию · визуальная демонстрация',build:'Основание → стены → башни → знамя'}[mode]});
document.getElementById('plus').onclick=()=>c.size=Math.min(110,c.size*1.15);document.getElementById('minus').onclick=()=>c.size=Math.max(30,c.size/1.15);
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>document.querySelector(`[data-mode="${b.dataset.action}"]`).click());
let drag;canvas.style.touchAction='none';canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:c.x,y:c.y}};canvas.onpointermove=e=>{if(!drag)return;let dx=(e.clientX-drag.px)/c.size,dy=(e.clientY-drag.py)/(c.size*.5);c.x=drag.x-(dx+dy)/2;c.y=drag.y-(dy-dx)/2};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
const trees=[[2,3],[3,3],[3,2],[4,2],[2,4],[3,5],[4,4],[7,9],[8,10],[10,8],[11,9],[4,9],[2,8],[1,6],[9,4],[10,3],[11,2],[1,1],[2,2],[4,1],[7,2],[8,2],[3,9],[2,10]];
function frame(t){ctx.fillStyle='#b9c9bc';ctx.fillRect(0,0,c.width,c.height);const p=makePainter(ctx,c),tm=reduced?0:t;for(let sum=0;sum<24;sum++)for(let x=0;x<12;x++){let y=sum-x;if(y<0||y>=12)continue;drawTile(p,x,y,x===5?'water':x===6&&y>3&&y<9?'road':'grass',(x*13+y*7)%9/9,tm)}
for(let y=0;y<12;y++){drawBank(p,4.6,y);drawBank(p,5.4,y)}
let elapsed=(t-start)/1000,cycle=elapsed%3.6,objects=[];for(let[x,y]of trees)objects.push({x,y,draw:()=>drawTree(p,x,y,.7+(x%3)*.15,y%4===0)});for(let[x,y]of [[0,2],[1,2],[0,3],[9,1],[10,1],[10,0],[11,1],[1,10]])objects.push({x,y,draw:()=>drawMountain(p,x,y,1+(x%2)*.35)});
objects.push({x:5,y:6,draw:()=>drawBridge(p,5,6)},{x:8,y:6,draw:()=>drawCastle(p,8,6,{time:tm,reducedMotion:reduced,progress:mode==='build'&&!reduced?Math.min(1,(elapsed%5)/3.5):1})},{x:2,y:5,draw:()=>drawCastle(p,2,5,{color:mode==='capture'&&cycle>1.5?'#326cbd':'#527b48',time:tm,reducedMotion:reduced})});for(let[x,y]of [[9,7],[9,8],[10,7]])objects.push({x,y,draw:()=>drawFarm(p,x,y,tm)});
let step=mode==='walk'?Math.min(2,cycle*.8):0,ux=mode==='melee'?4:6,uy=mode==='melee'?6.7:8-step;objects.push({x:ux,y:uy,draw:()=>drawUnit(p,ux,uy,{time:tm,state:mode==='melee'&&cycle<.8?'attack':mode==='walk'&&step<2?'walk':mode==='defend'?'defend':'idle',progress:cycle/.8,selected:true,reducedMotion:reduced})});objects.push({x:7,y:8,draw:()=>drawUnit(p,7,8,{time:tm,type:'archer',state:mode==='attack'&&cycle<.6?'attack':'idle',progress:cycle/.6,reducedMotion:reduced})},{x:4,y:6,draw:()=>drawUnit(p,4,6,{time:tm,color:'#4e8251',hp:mode==='attack'&&cycle>1.3?.4:.6,state:mode==='melee'&&cycle>=1.1?'defeat':mode==='melee'&&cycle>=.65?'hit':mode==='attack'&&cycle>=1.3&&cycle<1.7?'hit':'idle',progress:(cycle-1.3)/.4,reducedMotion:reduced})});for(let [x,y] of [[7,5],[8,7],[3,7],[2,6],[9,9],[7,10]])objects.push({x,y,draw:()=>drawShrub(p,x+.2,y+.2)});
if(mode==='walk')for(let y=6;y<9;y++)p.polygon([[5.53,y-.47,.015],[6.47,y-.47,.015],[6.47,y+.47,.015],[5.53,y+.47,.015]],'#64d5e637','#93e4df');
objects.sort((a,b)=>a.x+a.y-b.x-b.y);objects.forEach(o=>o.draw());if(mode==='melee'&&cycle>=.65&&cycle<1.05)drawImpact(p,4,6,(cycle-.65)/.4,{reducedMotion:reduced});if(mode==='attack'){if(cycle>=.6&&cycle<1.3)drawProjectile(p,{x:7,y:8},{x:4,y:6},(cycle-.6)/.7,{reducedMotion:reduced});if(cycle>=1.3&&cycle<1.7)drawImpact(p,4,6,(cycle-1.3)/.4,{reducedMotion:reduced})}drawSmoke(p,8.25,5.8,tm,reduced);
const ac=project(ux,uy,0,c),bar=document.getElementById('actions');bar.style.left=Math.max(85,Math.min(c.width-85,ac.x))+'px';bar.style.top=Math.max(170,Math.min(c.height-260,ac.y+55))+'px';
p.label(8,6,-.3,'ЛАЗУРНЫЙ ПРЕСТОЛ');requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
