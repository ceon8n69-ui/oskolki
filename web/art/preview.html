<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Осколки — визуальная мастерская</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#21374d;background:#b5c8ba;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}header{position:fixed;inset:0 0 auto;background:#f4eddfef;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 20px 20px;box-shadow:0 4px 20px #2343}h1{font:700 23px Georgia;margin:0}header span{font-size:12px;letter-spacing:1px}aside{position:fixed;left:24px;top:90px;background:#20364eef;color:#f8efd9;padding:14px 20px;border-radius:12px;font-size:13px;line-height:1.7}aside small{display:block;color:#bfd0d9}section{position:fixed;bottom:82px;left:24px;background:#f7efdfed;border:1px solid #fff9;border-radius:18px;padding:18px 24px;min-width:300px}section h2{font:700 24px Georgia;margin:0 0 7px}section p{font-size:13px;margin:0;color:#657480}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:9px;padding:13px 22px;background:#1c3049;border-radius:20px 20px 0 0}button{font:600 13px system-ui;background:#304760;color:#f7f0df;border:1px solid #ffffff30;border-radius:10px;padding:14px 18px;cursor:pointer}button.active{background:#ecc073;color:#293e52}nav label{margin:auto 0 auto auto;color:#e6ebec;font-size:12px}#zoom{position:fixed;right:20px;top:90px;display:grid;gap:8px}#zoom button{background:#f7edda;color:#22394e}@media(max-width:600px){h1{font-size:17px}header{padding:16px}header span{font-size:9px;max-width:90px}aside{left:12px;top:74px;font-size:11px;padding:10px 14px}section{left:12px;right:12px;min-width:0;bottom:123px;padding:14px}section h2{font-size:20px}nav{flex-wrap:wrap;padding:10px;gap:6px}button{padding:12px 10px;font-size:11px}nav label{width:100%;text-align:right}#zoom{top:160px;right:10px}}
</style><canvas id="scene"></canvas><header><h1>♛ ОСКОЛКИ КОРОЛЕВСТВ</h1><span>ВИЗУАЛЬНАЯ МАСТЕРСКАЯ · 01</span></header><aside>Союз городов · Солнечная долина<small>Демонстрация графики и анимаций</small></aside><div id="zoom"><button id="plus" aria-label="Приблизить">＋</button><button id="minus" aria-label="Отдалить">−</button></div><section><h2 id="title">Страж Союза</h2><p id="desc">Сталь, синие знамёна и тёплый камень</p></section><nav><button data-mode="idle" class="active">Ожидание</button><button data-mode="walk">Движение</button><button data-mode="attack">Атака</button><button data-mode="build">Стройка</button><label><input id="motion" type="checkbox"> Уменьшить движение</label></nav><script type="module">
import{makePainter,project,unproject,drawTile,drawTree,drawMountain,drawBridge,drawCastle,drawFarm,drawUnit,drawProjectile,drawImpact}from'./kingdom-art.js';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let mode='idle',start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,c={x:6,y:6,size:65,width:innerWidth,height:innerHeight};document.getElementById('motion').checked=reduced;document.getElementById('motion').onchange=e=>reduced=e.target.checked;
function resize(){c.width=innerWidth;c.height=innerHeight;let d=Math.min(devicePixelRatio,2);canvas.width=c.width*d;canvas.height=c.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();onresize=resize;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;start=performance.now();document.querySelectorAll('[data-mode]').forEach(v=>v.classList.toggle('active',v===b));document.getElementById('title').textContent={idle:'Страж Союза',walk:'Марш через долину',attack:'Залп лучника',build:'Возведение крепости'}[mode];document.getElementById('desc').textContent={idle:'Сталь, синие знамёна и тёплый камень',walk:'Шаги, поворот и перемещение по маршруту',attack:'Подготовка → полёт стрелы → попадание',build:'Основание → стены → башни → знамя'}[mode]});
document.getElementById('plus').onclick=()=>c.size=Math.min(110,c.size*1.15);document.getElementById('minus').onclick=()=>c.size=Math.max(30,c.size/1.15);
let drag;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:c.x,y:c.y}};canvas.onpointermove=e=>{if(!drag)return;let dx=(e.clientX-drag.px)/c.size,dy=(e.clientY-drag.py)/(c.size*.5);c.x=drag.x-(dx+dy)/2;c.y=drag.y-(dy-dx)/2};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
const trees=[[2,3],[3,3],[3,2],[4,2],[2,4],[3,5],[4,4],[7,9],[8,10],[10,8],[11,9],[4,9],[2,8],[1,6],[9,4],[10,3],[11,2],[1,1],[2,2],[4,1],[7,2],[8,2],[3,9],[2,10]];
function frame(t){ctx.fillStyle='#b9c9bc';ctx.fillRect(0,0,c.width,c.height);const p=makePainter(ctx,c),tm=reduced?0:t;for(let sum=0;sum<24;sum++)for(let x=0;x<12;x++){let y=sum-x;if(y<0||y>=12)continue;drawTile(p,x,y,x===5?'water':x===6&&y>3&&y<9?'road':'grass',(x*13+y*7)%9/9,tm)}
let elapsed=(t-start)/1000,cycle=elapsed%3.6,objects=[];for(let[x,y]of trees)objects.push({x,y,draw:()=>drawTree(p,x,y,.7+(x%3)*.15,y%4===0)});for(let[x,y]of [[0,2],[1,2],[0,3],[9,1],[10,1],[10,0],[11,1],[1,10]])objects.push({x,y,draw:()=>drawMountain(p,x,y,1+(x%2)*.35)});
objects.push({x:5,y:6,draw:()=>drawBridge(p,5,6)},{x:8,y:6,draw:()=>drawCastle(p,8,6,{time:tm,reducedMotion:reduced,progress:mode==='build'?Math.min(1,(elapsed%5)/3.5):1})},{x:2,y:5,draw:()=>drawCastle(p,2,5,{color:'#527b48',time:tm,reducedMotion:reduced})});for(let[x,y]of [[9,7],[9,8],[10,7]])objects.push({x,y,draw:()=>drawFarm(p,x,y,tm)});
let step=mode==='walk'?Math.min(2,cycle*.8):0,ux=6,uy=8-step;objects.push({x:ux,y:uy,draw:()=>drawUnit(p,ux,uy,{time:tm,state:mode==='walk'&&step<2?'walk':'idle',selected:true,reducedMotion:reduced})});objects.push({x:7,y:8,draw:()=>drawUnit(p,7,8,{time:tm,type:'archer',state:mode==='attack'&&cycle<.6?'attack':'idle',progress:cycle/.6,reducedMotion:reduced})},{x:4,y:6,draw:()=>drawUnit(p,4,6,{time:tm,color:'#4e8251',hp:.6,reducedMotion:reduced})});objects.sort((a,b)=>a.x+a.y-b.x-b.y);objects.forEach(o=>o.draw());if(mode==='attack'){if(cycle>=.6&&cycle<1.3)drawProjectile(p,{x:7,y:8},{x:4,y:6},(cycle-.6)/.7,{reducedMotion:reduced});if(cycle>=1.3&&cycle<1.7)drawImpact(p,4,6,(cycle-1.3)/.4,{reducedMotion:reduced})}p.label(8,6,-.3,'ЛАЗУРНЫЙ ПРЕСТОЛ');requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
